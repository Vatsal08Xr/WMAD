<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Unexpected Banana Observatory</title>
<style>
	body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17142b; color: #ffe66d; font: 1.2rem monospace; }
	#banana { cursor: pointer; user-select: none; font-size: 7rem; transition: transform .2s; }
	#banana:hover { transform: rotate(17deg) scale(1.1); }
</style>
<main>
	<div id="banana" title="Do not trust the banana">🍌</div>
	<p id="message">The banana is calculating.</p>
</main>
<script>
	const messages = [
		'A tiny wizard approved this banana.',
		'The moon owes it three buttons.',
		'404: sensible explanation not found.',
		'Congratulations! You found the yellow comma.'
	];
	let clicks = 0;
	banana.onclick = () => {
		clicks++;
		banana.style.filter = `hue-rotate(${clicks * 47}deg)`;
		message.textContent = messages[Math.floor(Math.random() * messages.length)] +
			` (banana clicks: ${clicks})`;
	};
	setInterval(() => document.body.style.background =
		`hsl(${Math.random() * 360}, 35%, 12%)`, 9001);
</script>
</html>
